name: rappid-hatch

# Auto-speciation for organisms hatched via "Use this template".
#
# When someone generates a new repo from this one (a template), the copied files
# still carry THIS organism's identity. On the first push, this workflow runs
# speciate.sh, which derives the new identity from the repo's own `git remote
# origin`, rewrites the gateway self-identity, records the lineage, and commits
# the result back. The hatched repo then pulls from itself — zero manual steps.
#
# It NEVER touches any ancestor: `git push` targets this repo's own origin only.
# On a template (the grail/seed) or a fork the job is skipped; even if it ran it
# would be a no-op, because origin already equals the content identity.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hatch:
    # Run only on a real hatched copy — not on the template itself, not on forks.
    # `!= true` (rather than `== false`) so a missing field defaults to running;
    # speciate.sh's idempotency makes an unnecessary run harmless anyway.
    if: >-
      github.event.repository.is_template != true &&
      github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Speciate to this repo's own identity
        run: |
          chmod +x ./speciate.sh
          ./speciate.sh -y

      - name: Commit the hatch if identity changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already speciated — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "rappid: hatch ${GITHUB_REPOSITORY} (auto-speciation)"
          git push || {
            echo "::error::Could not push the auto-hatch. Enable Settings → Actions →"
            echo "::error::Workflow permissions → 'Read and write', or run ./speciate.sh locally."
            exit 1
          }
